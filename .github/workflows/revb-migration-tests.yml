name: RevB migration synthetic tests
on:
  push:
    branches: ['tool/revb-migration-v01-20261003']
    paths:
      - 'tools/revb_migrate/**'
      - '.github/workflows/revb-migration-tests.yml'
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute synthetic tests only
        working-directory: tools/revb_migrate
        run: python test_revb_migrate.py
      - name: Print machine test receipt
        if: always()
        working-directory: tools/revb_migrate
        run: python -c "from pathlib import Path; p=Path('TEST_RESULTS.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'NO_TEST_RECEIPT')"
      - name: Upload source and test receipt (never ROMs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: revb-migration-${{ matrix.os }}-${{ github.sha }}
          path: |
            tools/revb_migrate/revb_migrate.py
            tools/revb_migrate/test_revb_migrate.py
            tools/revb_migrate/README_CN.md
            tools/revb_migrate/TEST_RESULTS.json
            tools/revb_migrate/ACCEPTANCE_MATRIX.json
          if-no-files-found: error
          retention-days: 30
