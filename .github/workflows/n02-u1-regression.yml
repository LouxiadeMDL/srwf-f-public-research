name: N02-U1 public-safe regression
on:
  push:
    paths:
      - "tools/n02_u1_baseline_builder.py"
      - "tools/n02_u1_independent_verify.py"
      - "tools/n02_u1_restore_parent.py"
      - "tests/test_n02_u1_offline_pipeline.py"
      - "tests/test_n02_u1_parent_restore.py"
      - ".github/workflows/n02-u1-regression.yml"
  workflow_dispatch:
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify builder and independent audit (synthetic data only)
        run: |
          python tests/test_n02_u1_parent_restore.py
          python tests/test_n02_u1_offline_pipeline.py
      - name: Package public-safe N02-U1 source snapshot
        run: |
          set -eu
          mkdir -p public_backup
          cp --parents \
            tools/n02_u1_baseline_builder.py \
            tools/n02_u1_independent_verify.py \
            tools/n02_u1_restore_parent.py \
            tests/test_n02_u1_offline_pipeline.py \
            tests/test_n02_u1_parent_restore.py \
            .github/workflows/n02-u1-regression.yml \
            docs/2026-11-21-n02-u1-baseline-recovery.md \
            public_backup/
          git rev-parse HEAD > public_backup/GIT_COMMIT_SHA.txt
          (cd public_backup && find . -type f ! -name SOURCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SOURCE_SHA256SUMS.txt)
      - name: Upload public-safe N02-U1 recovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: N02_U1_PUBLIC_SOURCE_20261121
          path: public_backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
